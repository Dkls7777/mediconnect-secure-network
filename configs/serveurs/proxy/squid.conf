# MediConnect - relais sortant (proxy web des utilisateurs du siege)
# Les postes internes n'ont aucune route vers Internet (ANSSI R19) : la navigation passe
# obligatoirement par ce relais, place en DMZ, qui filtre et journalise.

# Qui a le droit d'utiliser le relais
acl lan_siege src 10.10.10.0/24

# Ce qui est autorise : web uniquement
acl ports_web port 80 443
acl port_tls  port 443
acl CONNECT   method CONNECT
acl interdits dstdomain "/etc/squid/mediconnect-interdits.txt"

http_access deny !ports_web
http_access deny CONNECT !port_tls
http_access deny interdits
http_access allow lan_siege
http_access deny all

http_port 172.16.10.20:3128
dns_nameservers 9.9.9.9 1.1.1.1

# Pas de cache dans la maquette, et le relais ne divulgue ni l'adresse du poste ni sa version
cache deny all
forwarded_for delete
via off
httpd_suppress_version_string on
visible_hostname relais-sortant.mediconnect.lab

access_log daemon:/var/log/squid/access.log squid
logfile_rotate 7
coredump_dir /var/spool/squid
