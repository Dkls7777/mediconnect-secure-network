# SRV-DEMO : copie simplifiee de la plateforme, donnees fictives uniquement.
# Zone isolee de la production : accessible aux commerciaux via le VPN, jamais depuis Internet.
server {
    listen 80;
    server_name demo.mediconnect.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/demo.crt;
    ssl_certificate_key /etc/nginx/tls/demo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/demo;
    index index.html;

    access_log /var/log/nginx/demo-access.log;
    error_log  /var/log/nginx/demo-error.log;
}
