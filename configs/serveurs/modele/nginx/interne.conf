# SRV-INTERNE : applications internes de la zone SERVEURS.
# Une adresse par application, pour que les pare-feux puissent filtrer par groupe d'utilisateurs :
#   10.10.20.20 CRM (commerciaux), 10.10.20.30 comptabilite, 10.10.20.40 support.

server {
    listen 10.10.20.20:443 ssl;
    server_name crm.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/interne.crt;
    ssl_certificate_key /etc/nginx/tls/interne.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/interne/crm;
    index index.html;

    access_log /var/log/nginx/crm-access.log;
    error_log  /var/log/nginx/crm-error.log;
}

server {
    listen 10.10.20.30:443 ssl;
    server_name compta.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/interne.crt;
    ssl_certificate_key /etc/nginx/tls/interne.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/interne/compta;
    index index.html;

    access_log /var/log/nginx/compta-access.log;
    error_log  /var/log/nginx/compta-error.log;
}

server {
    listen 10.10.20.40:443 ssl;
    server_name support.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/interne.crt;
    ssl_certificate_key /etc/nginx/tls/interne.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/interne/support;
    index index.html;

    access_log /var/log/nginx/support-access.log;
    error_log  /var/log/nginx/support-error.log;
}
