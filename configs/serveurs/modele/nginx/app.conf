# SRV-APP : application MediConnect (zone de services exposes, derriere le pare-feu interne)
# N'accepte que les deux reverse proxies de la DMZ (defense en profondeur, en plus du pare-feu).
server {
    listen 8443 ssl;
    server_name app.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/app.crt;
    ssl_certificate_key /etc/nginx/tls/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    allow 172.16.10.10;   # reverse proxy patients
    allow 172.16.10.11;   # reverse proxy medecins
    deny  all;

    root  /var/www/mediconnect;
    index index.html;

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;
}
