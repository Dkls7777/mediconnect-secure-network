# SRV-RELAIS : reverse proxy MEDECINS (chaine separee de celle des patients, ANSSI R6)
# Publie sur Internet en 192.36.253.12:443 par le pare-feu externe.
# Acces a /pro/ soumis a une authentification a deux facteurs (mot de passe + code TOTP),
# verifiee par le service local mc-mfa. Base d'utilisateurs propre a la DMZ (ANSSI R10).
server {
    listen 172.16.10.11:80;
    server_name pro.mediconnect.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 172.16.10.11:443 ssl;
    server_name pro.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/medecins.crt;
    ssl_certificate_key /etc/nginx/tls/medecins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    location = / {
        return 302 /pro/;
    }

    # Pages du portail d'authentification (connexion, deconnexion)
    location /mfa/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Verification de session : appelee par nginx avant chaque requete vers /pro/, jamais par le client
    location = /mfa/check {
        internal;
        proxy_pass http://127.0.0.1:9000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /pro/ {
        auth_request /mfa/check;
        error_page 401 = @connexion;
        auth_request_set $mc_user $upstream_http_x_mc_user;

        proxy_pass https://172.16.20.10:8443/pro/;
        proxy_ssl_verify off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-MC-User         $mc_user;
        proxy_hide_header X-Powered-By;
    }

    location @connexion {
        return 302 /mfa/login;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/medecins-access.log;
    error_log  /var/log/nginx/medecins-error.log;
}
