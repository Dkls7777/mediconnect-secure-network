# SRV-RELAIS : reverse proxy MEDECINS (chaine separee de celle des patients, ANSSI R6)
# Publie sur Internet en 192.36.253.12:443 par le pare-feu externe.
# La MFA (portail d'authentification TOTP) sera ajoutee ici a l'etape identite.
server {
    listen 172.16.10.11:80;
    server_name pro.mediconnect.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 172.16.10.11:443 ssl;
    server_name pro.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/medecins.crt;
    ssl_certificate_key /etc/nginx/tls/medecins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    location = / {
        return 302 /pro/;
    }

    location /pro/ {
        proxy_pass https://172.16.20.10:8443/pro/;
        proxy_ssl_verify off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/medecins-access.log;
    error_log  /var/log/nginx/medecins-error.log;
}
