# SRV-RELAIS : reverse proxy PATIENTS (chaine publique, ANSSI R6 et R8)
# Publie sur Internet en 192.36.253.11:443 par le pare-feu externe.
server {
    listen 172.16.10.10:80;
    server_name www.mediconnect.lab;
    return 301 https://$host$request_uri;      # HTTPS exclusif
}

server {
    listen 172.16.10.10:443 ssl;
    server_name www.mediconnect.lab;

    ssl_certificate     /etc/nginx/tls/patients.crt;
    ssl_certificate_key /etc/nginx/tls/patients.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    # L'espace professionnel n'est jamais servi par la chaine patients
    location /pro {
        return 403;
    }

    location / {
        proxy_pass https://172.16.20.10:8443;   # rupture protocolaire : nouvelle session TLS vers SRV-APP
        proxy_ssl_verify off;                   # certificat auto-signe en maquette (limite documentee)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;         # ANSSI R21 : masquer l'architecture interne
    }

    access_log /var/log/nginx/patients-access.log;
    error_log  /var/log/nginx/patients-error.log;
}
